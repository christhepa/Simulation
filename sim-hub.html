<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 1300px;
            width: 100%;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .button-card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .button-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .button-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            border-color: #e0e0e0;
        }

        .button-card:hover::before {
            transform: scaleX(1);
        }

        .button-card a {
            text-decoration: none;
            color: inherit;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .icon {
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        .button-card h2 {
            font-size: 1.85em;
            color: #333;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .card-monitor:hover h2 {
            color: #00bcd4;
        }

        .card-telemetry:hover h2 {
            color: #ff9800;
        }

        .card-emr:hover h2 {
            color: #9c27b0;
        }

        @media (max-width: 768px) {
            .buttons-grid {
                gap: 20px;
            }

            .button-card {
                min-height: 300px;
                padding: 25px;
            }

            .icon {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
